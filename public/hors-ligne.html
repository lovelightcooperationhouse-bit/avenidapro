<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0C356A" />
    <title>Hors connexion · Avenida</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #06152e; color: #fff; text-align: center; padding: 24px; }
      img { width: 96px; height: 96px; border-radius: 20px; background: #fff; object-fit: contain; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: rgba(255, 255, 255, 0.75); max-width: 320px; margin: 0 auto 24px; line-height: 1.5; }
      button { background: #e30613; color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Hôtel École Avenida" />
      <h1>Vous êtes hors connexion</h1>
      <p>Vérifiez votre connexion internet (données mobiles ou Wi-Fi), puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
